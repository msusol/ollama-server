services:
  ollama-server:
    image: ollama/ollama:latest
    container_name: ollama-server
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1
    ports:
      # Bound to loopback only — reachable from host-side clients on this
      # box and from other containers over the Docker network by service
      # name (ollama-server:11434), never exposed externally.
      - "127.0.0.1:11436:11434"
    volumes:
      - ollama_server_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_server_data:
    external: true
